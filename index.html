<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Card Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="hero-badge">Pokémon Explorer</p>
      <h1>Build a collection of beautiful Pokémon cards.</h1>
      <p class="hero-subtitle">Pick a type, choose how many cards you want, and discover a fresh random lineup every time.</p>
    </section>

    <section class="control-panel">
      <form id="pokemon-form" class="pokemon-form" aria-label="Pokémon card generator">
        <label for="num-cards">Number of Cards</label>
        <input type="number" id="num-cards" min="1" max="20" value="6" required>

        <label for="type-select">Category (Type)</label>
        <select id="type-select">
          <option value="fire">Fire</option>
          <option value="water">Water</option>
          <option value="grass">Grass</option>
          <option value="electric">Electric</option>
          <option value="bug">Bug</option>
          <option value="psychic">Psychic</option>
          <option value="ground">Ground</option>
          <option value="dragon">Dragon</option>
          <option value="ice">Ice</option>
          <option value="fairy">Fairy</option>
        </select>

        <button type="submit" id="submit-btn">Generate Cards</button>
      </form>
    </section>

    <p id="status-message" class="status-message" aria-live="polite"></p>
    <section id="cards-container" class="cards-container" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
